# go2rtc configuration — RTSP/ONVIF cameras → HLS for the dashboard.
#
# The cameras service (agent/cameras/proxy.py) reads this file and asks
# go2rtc to start streams for each configured camera.
#
# Run go2rtc via docker-compose (see /docker-compose.yml) or as a binary.

api:
  origin: "*"

rtsp:
  # Per-camera RTSP URLs. Passwords are read from env vars at runtime.
  # See agent/cameras/discovery.py for auto-population from ONVIF.

streams:
  # bedroom-cam:
  #   - rtsp://${CAM_BEDROOM_USER}:${CAM_BEDROOM_PASS}@192.168.178.40:554/Streaming/Channels/101
  # living-cam:
  #   - rtsp://${CAM_LIVING_USER}:${CAM_LIVING_PASS}@192.168.178.41:554/h264Preview_01_main

# HLS is exposed by go2rtc on /api/stream.m3u8 by default.
# The dashboard's <video src="..."> points at this URL.